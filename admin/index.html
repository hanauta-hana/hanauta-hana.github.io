<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* 自動更新チェック */
window.HANA_V="202611282019";
(function(){try{fetch("../version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
if(j&&j.v&&j.v!==window.HANA_V){var k="hana_vr";if(sessionStorage.getItem(k)===j.v)return;sessionStorage.setItem(k,j.v);
var u=new URL(location.href);u.searchParams.set("r",j.v);var go=function(){location.replace(u.toString())};try{fetch(location.pathname,{cache:"reload"}).then(go,go)}catch(e){go()}}}).catch(function(){})}catch(e){}})();
</script>
<meta name="robots" content="noindex,nofollow">
<title>はな更新ページ</title>
<meta name="theme-color" content="#f6a8c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はな管理">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../img/admin-apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=202611282019">
</head>
<body>
<header class="bar">
  <h1>かんたん更新ページ</h1>
  <p>ここから内容を更新できます</p>
</header>

<main id="app">
  <!-- ログイン -->
  <section id="login" class="card">
    <h2>合言葉をいれてね</h2>
    <form id="login-form">
      <input type="password" id="pass" autocomplete="current-password" placeholder="合言葉" required>
      <button class="btn big" type="submit">ひらく</button>
      <p class="status" id="login-status" role="status"></p>
    </form>
    <p class="note demo" id="demo-note" hidden>(試作モード)合言葉は「<b id="demo-pass"></b>」です。保存は、この端末のブラウザ内だけです。</p>
  </section>

  <!-- メニュー(大きなタイル) -->
  <section id="menu" hidden>
    <div class="tiles">
      <button class="tile" data-panel="schedule"><i>🕒</i><b>配信予定</b><small>今週の時間・お休み</small></button>
      <button class="tile" data-panel="news"><i>🌸</i><b>お知らせ</b><small>ホームに出る文章</small></button>
      <button class="tile" data-panel="home"><i>🏠</i><b>ホームの言葉</b><small>見出し・説明</small></button>
      <button class="tile" data-panel="profile"><i>🩷</i><b>プロフィール</b><small>文章・タグ</small></button>
      <button class="tile" data-panel="outfits"><i>👗</i><b>立ち絵・衣装</b><small>写真の追加・削除</small></button>
      <button class="tile" data-panel="gallery"><i>🎮</i><b>ひとこま写真</b><small>配信の画面など</small></button>
      <button class="tile" data-panel="omikuji"><i>🎴</i><b>おみくじ</b><small>結果の文章</small></button>
      <button class="tile" data-panel="reward"><i>🎁</i><b>スタンプのごほうび</b><small>コンプリート時の言葉</small></button>
      <button class="tile" data-panel="inbox"><i>💬</i><b>メッセージ</b><small>届いた内容を見る</small></button>
    </div>
    <p class="foot"><button class="link" id="logout">ログアウト</button></p>
  </section>

  <!-- 各パネル -->
  <section id="panel" hidden>
    <button class="back" id="back">← もどる</button>
    <div id="panel-body"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="foot-refresh"><button type="button" id="refresh-btn" class="refresh-btn">最新版に更新</button></div>
<script src="../config.js?v=202611282019"></script>
<script src="../api.js?v=202611282019"></script>
<script>(function(){var b=document.getElementById("refresh-btn");if(!b)return;b.addEventListener("click",function(){b.textContent="更新中…";b.disabled=true;var go=function(){var u=new URL(location.href);u.searchParams.set("r",Date.now());var f=function(){location.replace(u.toString())};try{fetch(location.pathname,{cache:"reload"}).then(f,f)}catch(e){f()}};try{if(window.caches&&caches.keys){caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}).then(go,go);return}}catch(e){}go()})})();</script>
<script src="admin.js?v=202611282019"></script>
</body>
</html>
